<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Attendance | Employee Portal</title>
<link href="./bootstrap/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link rel="stylesheet" href="./css/global.css">
<script src="./bootstrap/js/bootstrap.bundle.min.js"></script>
<script src="./js/api.js"></script>
<script src="./js/auth.js"></script>
</head>
<body class="fade-in">
<script>
    if (!requireAuth()) {}
</script>

<div class="content container-fluid" style="max-width:1200px;">
    <!-- Header -->
    <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
        <h2 class="system-title">
            <i class="bi bi-calendar-check-fill me-2"></i> Attendance Log
        </h2>
        <button class="btn-secondary-custom btn-sm" onclick="window.location.href='dashboard.html'">
            <i class="bi bi-arrow-left me-1"></i> Back to Dashboard
        </button>
    </div>

    <!-- Admin/HR Search Control -->
    <div class="clean-card mb-4 border border-secondary" id="searchCard" style="display:none; background: rgba(0,0,0,0.2);">
        <h6 class="text-white mb-3">View Employee Attendance</h6>
        <div class="row g-3 align-items-end">
            <div class="col-md-4">
                <input type="text" id="searchEmpId" class="form-control-custom" placeholder="Employee ID (e.g. EMP001)">
            </div>
            <div class="col-md-2">
                <button class="btn-primary-custom w-100" onclick="loadAttendance(document.getElementById('searchEmpId').value.trim())">
                    <i class="bi bi-search me-2"></i> Load
                </button>
            </div>
        </div>
    </div>

    <div class="row g-4">
        <!-- Log Attendance Form -->
        <div class="col-md-4 mb-4" id="logFormCol">
            <div class="clean-card h-100 border border-secondary">
                <h5 class="text-white mb-3"><i class="bi bi-clock-history me-2"></i>Log Attendance</h5>
                <form id="attendanceForm" onsubmit="logAttendance(event)">
                    <div class="mb-3" id="logEmpIdGroup">
                        <label class="form-label-custom">Employee ID (locked)</label>
                        <input type="text" id="logEmpId" class="form-control-custom" required readonly style="background: rgba(255,255,255,0.05);">
                    </div>
                    <div class="mb-3">
                        <label class="form-label-custom">Date</label>
                        <input type="date" id="logDate" class="form-control-custom" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label-custom">Time In</label>
                        <input type="time" id="logTimeIn" class="form-control-custom" required>
                    </div>
                    <div class="mb-4">
                        <label class="form-label-custom">Time Out</label>
                        <input type="time" id="logTimeOut" class="form-control-custom">
                        <div class="small text-dim mt-1">Leave blank if currently working.</div>
                    </div>
                    <button type="submit" class="btn-success w-100 py-2 border-0 rounded fw-bold" id="btnLog">Save Log</button>
                    <div id="logMsg" class="mt-2 text-danger small fw-medium text-center"></div>
                </form>
            </div>
        </div>

        <!-- Attendance Logs Table -->
        <div class="col-md-8">
            <div class="table-responsive bg-dark rounded p-3 border border-secondary shadow-lg h-100">
                <h5 class="text-white mb-3" id="tableTitle">Attendance Records</h5>
                <table class="table table-dark table-hover text-center align-middle">
                    <thead>
                        <tr class="text-dim small text-uppercase">
                            <th>Date</th>
                            <th>Time In</th>
                            <th>Time Out</th>
                        </tr>
                    </thead>
                    <tbody id="attendanceTableBody">
                        <tr><td colspan="3" class="text-dim py-4">No records loaded.</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script>
const user = getCurrentUser();

document.addEventListener('DOMContentLoaded', () => {
    // Basic setup configurations
    document.getElementById('logDate').value = new Date().toISOString().split('T')[0];
    
    if (user.role === 'employee') {
        const empInput = document.getElementById('logEmpId');
        empInput.value = user.employee_id;
        document.getElementById('tableTitle').innerText = "My Attendance Logs";
        
        // Auto-load their attendance
        loadAttendance(user.employee_id);
    } else {
        // Admin / HR
        document.getElementById('searchCard').style.display = 'block';
        document.getElementById('logEmpId').removeAttribute('readonly');
        document.getElementById('logEmpId').style.background = 'transparent';
        document.getElementById('logEmpIdGroup').querySelector('label').innerText = "Employee ID";
        document.getElementById('tableTitle').innerText = "Select an Employee to view records";
    }
});

async function loadAttendance(empId) {
    if (!empId) {
        API.showToast("Please provide an Employee ID", "warning");
        return;
    }
    
    document.getElementById('logEmpId').value = empId; // Sync logging form
    
    if (user.role !== 'employee') {
        document.getElementById('tableTitle').innerText = `Records for ${empId}`;
    }

    const tbody = document.getElementById('attendanceTableBody');
    tbody.innerHTML = '<tr><td colspan="3" class="text-dim py-4">Loading...</td></tr>';
    
    try {
        const logs = await API.get(`/api/attendance?employee_id=${empId}`);
        if (logs.length === 0) {
            tbody.innerHTML = '<tr><td colspan="3" class="text-dim py-4">No attendance records found.</td></tr>';
            return;
        }

        tbody.innerHTML = logs.map(a => `
            <tr>
                <td class="fw-bold">${a.attendance_date}</td>
                <td><span class="badge bg-success p-2">${a.time_in ? a.time_in.substring(0,5) : '—'}</span></td>
                <td><span class="badge ${a.time_out ? 'bg-danger' : 'bg-secondary'} p-2">${a.time_out ? a.time_out.substring(0,5) : '—'}</span></td>
            </tr>
        `).join('');

    } catch (e) {
        tbody.innerHTML = '<tr><td colspan="3" class="text-danger py-4">Failed to load records.</td></tr>';
    }
}

async function logAttendance(e) {
    e.preventDefault();
    const btn = document.getElementById('btnLog');
    const msg = document.getElementById('logMsg');
    
    btn.disabled = true;
    msg.innerText = '';
    
    const empId = document.getElementById('logEmpId').value.trim();
    const payload = {
        employee_id: empId,
        attendance_date: document.getElementById('logDate').value,
        time_in: document.getElementById('logTimeIn').value,
        time_out: document.getElementById('logTimeOut').value || null
    };

    try {
        await API.post('/api/attendance', payload);
        API.showToast("Attendance successfully documented!", "success");
        loadAttendance(empId);
    } catch (err) {
        msg.innerText = err.message || "Failed to log attendance.";
    } finally {
        btn.disabled = false;
    }
}
</script>
</body>
</html>
