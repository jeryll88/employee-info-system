<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Attendance</title>

<link href="./bootstrap/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link rel="stylesheet" href="./css/global.css">
<link rel="stylesheet" href="./css/attendance.css">
<script src="./bootstrap/js/bootstrap.bundle.min.js"></script>
<script src="./js/api.js"></script>
<script src="./js/auth.js"></script>
<script src="./js/attendance.js"></script>
</head>

<body>
<div class="container d-flex align-items-center justify-content-center" style="min-height: 100vh;">
    <div class="premium-card w-100 fade-in" style="max-width: 500px; text-align: center;">

        <h2 class="system-title mb-4">
            <i class="bi bi-clock-history"></i> ATTENDANCE
        </h2>

        <div class="mb-5 mt-4">
            <label class="form-label text-dim small text-uppercase fw-bold tracking-wider">Employee ID</label>
            <input type="text" id="empId" class="form-control text-center bg-dark text-white border-secondary" placeholder="Enter ID..." style="font-size: 1.5rem; letter-spacing: 4px; border-radius: 12px; height: 60px;">
        </div>

        <div class="d-grid gap-3">
            <button class="btn btn-premium btn-lg py-3" onclick="handleClockAction('in')">
                <i class="bi bi-box-arrow-in-right me-2"></i> Clock In Now
            </button>

            <button class="btn btn-outline-danger btn-lg py-3" onclick="handleClockAction('out')">
                <i class="bi bi-box-arrow-right me-2"></i> Clock Out Now
            </button>
        </div>

        <div class="mt-5">
            <a href="dashboard.html" class="btn btn-link text-dim text-decoration-none small hover-primary">
                <i class="bi bi-arrow-left me-1"></i> Back to System Dashboard
            </a>
        </div>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        const user = getCurrentUser();
        if (user && user.role === 'employee') {
            const empIdInput = document.getElementById('empId');
            empIdInput.value = user.employee_id || '';
            empIdInput.disabled = true;
        }
    });

    async function handleClockAction(type) {
        const empId = document.getElementById('empId').value.trim();
        if (!empId) {
            API.showToast("Please enter an Employee ID", "warning");
            return;
        }
        
        if (type === 'in') await clockIn(empId);
        else await clockOut(empId);
    }
</script>
</body>
</html>
