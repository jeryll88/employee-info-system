<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Attendance | Employee Portal</title>
<link href="./bootstrap/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link rel="stylesheet" href="./css/global.css">
<link rel="stylesheet" href="./css/attendance.css">
<script src="./bootstrap/js/bootstrap.bundle.min.js"></script>
<script src="./js/api.js"></script>
<script src="./js/auth.js"></script>
<style>
.clock-display {
    font-size: 3rem;
    font-weight: 800;
    letter-spacing: 4px;
    color: #fff;
    font-family: 'Courier New', monospace;
    text-shadow: 0 0 20px rgba(99,102,241,0.6);
}
.clock-date { font-size: 1rem; color: #9ca3af; letter-spacing: 2px; }
.checkin-card {
    background: linear-gradient(135deg, rgba(99,102,241,0.15), rgba(139,92,246,0.1));
    border: 1px solid rgba(99,102,241,0.3);
    border-radius: 20px;
    padding: 40px;
    text-align: center;
}
.btn-checkin {
    background: linear-gradient(135deg, #22c55e, #16a34a);
    border: none;
    color: white;
    font-size: 1.1rem;
    font-weight: 700;
    padding: 16px 48px;
    border-radius: 50px;
    cursor: pointer;
    transition: all 0.3s ease;
    letter-spacing: 1px;
    box-shadow: 0 8px 25px rgba(34,197,94,0.3);
}
.btn-checkin:hover { transform: translateY(-3px); box-shadow: 0 12px 35px rgba(34,197,94,0.4); }
.btn-checkin:disabled { background: #374151; box-shadow: none; transform: none; cursor: not-allowed; }
.btn-checkout {
    background: linear-gradient(135deg, #ef4444, #dc2626);
    border: none;
    color: white;
    font-size: 1.1rem;
    font-weight: 700;
    padding: 16px 48px;
    border-radius: 50px;
    cursor: pointer;
    transition: all 0.3s ease;
    letter-spacing: 1px;
    box-shadow: 0 8px 25px rgba(239,68,68,0.3);
}
.btn-checkout:hover { transform: translateY(-3px); box-shadow: 0 12px 35px rgba(239,68,68,0.4); }
.btn-checkout:disabled { background: #374151; box-shadow: none; transform: none; cursor: not-allowed; }
.status-badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 10px 24px;
    border-radius: 50px;
    font-weight: 700;
    font-size: 0.9rem;
    letter-spacing: 1px;
    margin-bottom: 24px;
}
.status-in { background: rgba(34,197,94,0.15); border: 1px solid rgba(34,197,94,0.4); color: #22c55e; }
.status-out { background: rgba(239,68,68,0.15); border: 1px solid rgba(239,68,68,0.4); color: #ef4444; }
.status-none { background: rgba(156,163,175,0.15); border: 1px solid rgba(156,163,175,0.2); color: #9ca3af; }
.time-recorded { font-size: 0.85rem; color: #9ca3af; margin-top: 8px; }
</style>
</head>
<body class="fade-in">
<script>if (!requireAuth()) {}</script>

<div class="content container-fluid" style="max-width:1200px;">
    <!-- Header -->
    <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
        <h2 class="system-title">
            <i class="bi bi-calendar-check-fill me-2"></i> Attendance
        </h2>
        <button class="btn-secondary-custom btn-sm" onclick="window.location.href='dashboard.html'">
            <i class="bi bi-arrow-left me-1"></i> Back to Dashboard
        </button>
    </div>

    <!-- EMPLOYEE: Check-In / Check-Out Panel -->
    <div id="employeeCheckInPanel" style="display:none;">
        <div class="row g-4 mb-4">
            <div class="col-md-5">
                <div class="checkin-card h-100 d-flex flex-column align-items-center justify-content-center">
                    <!-- Live Clock -->
                    <div class="clock-date mb-1" id="clockDate"></div>
                    <div class="clock-display mb-4" id="clockTime">--:--:--</div>

                    <!-- Status Badge -->
                    <div id="todayStatusBadge" class="status-badge status-none">
                        <i class="bi bi-circle-fill" style="font-size:8px;"></i> Not Checked In
                    </div>

                    <!-- Time Recorded Info -->
                    <div id="timeRecordedInfo" class="time-recorded mb-4 text-center" style="min-height:40px;"></div>

                    <!-- Action Buttons -->
                    <div class="d-flex gap-3 flex-wrap justify-content-center">
                        <button id="btnCheckIn" class="btn-checkin" onclick="doCheckIn()">
                            <i class="bi bi-box-arrow-in-right me-2"></i> CHECK IN
                        </button>
                        <button id="btnCheckOut" class="btn-checkout" onclick="doCheckOut()" disabled>
                            <i class="bi bi-box-arrow-right me-2"></i> CHECK OUT
                        </button>
                    </div>
                    <div id="checkMsg" class="mt-3 small fw-medium text-danger text-center"></div>
                </div>
            </div>

            <!-- My Attendance History -->
            <div class="col-md-7">
                <div class="table-responsive bg-dark rounded p-3 border border-secondary shadow-lg h-100">
                    <h5 class="text-white mb-3"><i class="bi bi-clock-history me-2"></i>My Attendance History</h5>
                    <table class="table table-dark table-hover text-center align-middle">
                        <thead>
                            <tr class="text-dim small text-uppercase">
                                <th>Date</th>
                                <th>Check In</th>
                                <th>Check Out</th>
                                <th>Duration</th>
                            </tr>
                        </thead>
                        <tbody id="attendanceTableBody">
                            <tr><td colspan="4" class="text-dim py-4">Loading records...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- ADMIN/HR: Search + Manual Log Panel -->
    <div id="adminPanel" style="display:none;">
        <div class="clean-card mb-4 border border-secondary" style="background: rgba(0,0,0,0.2);">
            <h6 class="text-white mb-3">View & Manage Employee Attendance</h6>
            <div class="row g-3 align-items-end">
                <div class="col-md-4">
                    <input type="text" id="searchEmpId" class="form-control-custom" placeholder="Employee ID (e.g. EMP001)">
                </div>
                <div class="col-md-2">
                    <button class="btn-primary-custom w-100" onclick="loadAttendance(document.getElementById('searchEmpId').value.trim())">
                        <i class="bi bi-search me-2"></i> Load
                    </button>
                </div>
            </div>
        </div>

        <div class="row g-4">
            <!-- Manual Log Form -->
            <div class="col-md-4 mb-4">
                <div class="clean-card h-100 border border-secondary">
                    <h5 class="text-white mb-3"><i class="bi bi-pencil-square me-2"></i>Manual Log</h5>
                    <form id="attendanceForm" onsubmit="logAttendance(event)">
                        <div class="mb-3">
                            <label class="form-label-custom">Employee ID</label>
                            <input type="text" id="logEmpId" class="form-control-custom" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label-custom">Date</label>
                            <input type="date" id="logDate" class="form-control-custom" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label-custom">Time In</label>
                            <input type="time" id="logTimeIn" class="form-control-custom" required>
                        </div>
                        <div class="mb-4">
                            <label class="form-label-custom">Time Out</label>
                            <input type="time" id="logTimeOut" class="form-control-custom">
                            <div class="small text-dim mt-1">Leave blank if still working.</div>
                        </div>
                        <button type="submit" class="btn-success w-100 py-2 border-0 rounded fw-bold" id="btnLog">Save Log</button>
                        <div id="logMsg" class="mt-2 text-danger small fw-medium text-center"></div>
                    </form>
                </div>
            </div>
            <!-- Attendance Table -->
            <div class="col-md-8">
                <div class="table-responsive bg-dark rounded p-3 border border-secondary shadow-lg h-100">
                    <h5 class="text-white mb-3" id="tableTitle">Attendance Records</h5>
                    <table class="table table-dark table-hover text-center align-middle">
                        <thead>
                            <tr class="text-dim small text-uppercase">
                                <th>Date</th>
                                <th>Check In</th>
                                <th>Check Out</th>
                                <th>Duration</th>
                            </tr>
                        </thead>
                        <tbody id="attendanceTableBody">
                            <tr><td colspan="4" class="text-dim py-4">Search an employee to view records.</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
const user = getCurrentUser();

// ─── Utility: compute duration from time strings ─────────────
function calcDuration(timeIn, timeOut) {
    if (!timeIn || !timeOut) return '—';
    const [h1, m1] = timeIn.split(':').map(Number);
    const [h2, m2] = timeOut.split(':').map(Number);
    const totalMin = (h2 * 60 + m2) - (h1 * 60 + m1);
    if (totalMin <= 0) return '—';
    const hrs = Math.floor(totalMin / 60);
    const mins = totalMin % 60;
    return `${hrs}h ${mins}m`;
}

function formatTime12Hour(timeStr) {
    if (!timeStr) return '—';
    const [h, m] = timeStr.split(':').map(Number);
    const suffix = h >= 12 ? 'PM' : 'AM';
    const h12 = h % 12 || 12;
    return `${h12}:${m.toString().padStart(2, '0')} ${suffix}`;
}

// ─── Live Clock ───────────────────────────────────────────────
function startClock() {
    const clockEl = document.getElementById('clockTime');
    const dateEl  = document.getElementById('clockDate');
    if (!clockEl) return;
    const tick = () => {
        const now = new Date();
        clockEl.textContent = now.toLocaleTimeString('en-US', { hour12: true });
        dateEl.textContent  = now.toLocaleDateString('en-US', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
    };
    tick();
    setInterval(tick, 1000);
}

// ─── Employee Panel ───────────────────────────────────────────
async function initEmployeePanel() {
    document.getElementById('employeeCheckInPanel').style.display = 'block';
    startClock();
    await checkTodayStatus();
    await loadAttendance(user.employee_id);
}

async function checkTodayStatus() {
    const badge     = document.getElementById('todayStatusBadge');
    const infoEl    = document.getElementById('timeRecordedInfo');
    const btnIn     = document.getElementById('btnCheckIn');
    const btnOut    = document.getElementById('btnCheckOut');

    try {
        const rec = await API.get('/api/attendance/today');

        if (!rec || !rec.time_in) {
            // Not checked in yet
            badge.className      = 'status-badge status-none';
            badge.innerHTML      = '<i class="bi bi-circle-fill" style="font-size:8px;"></i> Not Checked In';
            infoEl.innerHTML     = '';
            btnIn.disabled       = false;
            btnOut.disabled      = true;
        } else if (rec.time_in && !rec.time_out) {
            // Checked in, not out
            badge.className       = 'status-badge status-in';
            badge.innerHTML       = '<i class="bi bi-circle-fill" style="font-size:8px;"></i> CHECKED IN';
            infoEl.innerHTML      = `<i class="bi bi-clock me-1"></i> In at <strong class="text-white">${formatTime12Hour(rec.time_in)}</strong>`;
            btnIn.disabled        = true;
            btnOut.disabled       = false;
        } else {
            // Fully clocked out
            badge.className       = 'status-badge status-out';
            badge.innerHTML       = '<i class="bi bi-check-circle-fill" style="font-size:14px;"></i> COMPLETED';
            infoEl.innerHTML      = `
                <div><i class="bi bi-box-arrow-in-right me-1"></i> In: <strong class="text-white">${formatTime12Hour(rec.time_in)}</strong></div>
                <div><i class="bi bi-box-arrow-right me-1"></i> Out: <strong class="text-white">${formatTime12Hour(rec.time_out)}</strong>
                &nbsp;|&nbsp; <span class="text-success">${calcDuration(rec.time_in, rec.time_out)}</span></div>`;
            btnIn.disabled        = true;
            btnOut.disabled       = true;
        }
    } catch (e) {
        badge.className = 'status-badge status-none';
    }
}

async function doCheckIn() {
    const btn = document.getElementById('btnCheckIn');
    const msg = document.getElementById('checkMsg');
    btn.disabled = true;
    msg.textContent = '';

    const now  = new Date();
    const date = now.toISOString().split('T')[0];
    const time = now.toTimeString().split(' ')[0];

    try {
        await API.post('/api/attendance', {
            attendance_date: date,
            time_in: time,
            time_out: null
        });
        API.showToast('Checked in successfully!', 'success');
        API.logActivity('Checked in to work');
        await checkTodayStatus();
        await loadAttendance(user.employee_id);
    } catch (err) {
        msg.textContent = err.message || 'Check-in failed.';
        btn.disabled = false;
    }
}

async function doCheckOut() {
    const btn = document.getElementById('btnCheckOut');
    const msg = document.getElementById('checkMsg');
    btn.disabled = true;
    msg.textContent = '';

    try {
        await API.put('/api/attendance/checkout', {});
        API.showToast('Checked out successfully!', 'success');
        API.logActivity('Checked out from work');
        await checkTodayStatus();
        await loadAttendance(user.employee_id);
    } catch (err) {
        msg.textContent = err.message || 'Check-out failed.';
        btn.disabled = false;
    }
}

// ─── Admin / HR Panel ─────────────────────────────────────────
function initAdminPanel() {
    document.getElementById('adminPanel').style.display = 'block';
    document.getElementById('logDate').value = new Date().toISOString().split('T')[0];
}

// ─── Shared: Load Attendance Table ────────────────────────────
async function loadAttendance(empId) {
    if (!empId) { API.showToast('Please provide an Employee ID', 'warning'); return; }

    const titleEl = document.getElementById('tableTitle');
    const tbody   = document.getElementById('attendanceTableBody');

    if (user.role !== 'employee' && titleEl) {
        titleEl.innerText = `Records for ${empId}`;
        document.getElementById('logEmpId').value = empId;
    }

    if (tbody) tbody.innerHTML = '<tr><td colspan="4" class="text-dim py-4">Loading...</td></tr>';

    try {
        const logs = await API.get(`/api/attendance?employee_id=${empId}`);
        if (!logs.length) {
            tbody.innerHTML = '<tr><td colspan="4" class="text-dim py-4">No attendance records found.</td></tr>';
            return;
        }
        tbody.innerHTML = logs.map(a => {
            const tin  = formatTime12Hour(a.time_in);
            const tout = formatTime12Hour(a.time_out);
            const dur  = calcDuration(a.time_in, a.time_out);
            return `<tr>
                <td class="fw-bold">${a.attendance_date}</td>
                <td><span class="badge bg-success p-2">${tin}</span></td>
                <td><span class="badge ${a.time_out ? 'bg-danger' : 'bg-secondary'} p-2">${tout}</span></td>
                <td class="text-dim small">${dur}</td>
            </tr>`;
        }).join('');
    } catch (e) {
        tbody.innerHTML = '<tr><td colspan="4" class="text-danger py-4">Failed to load records.</td></tr>';
    }
}

async function logAttendance(e) {
    e.preventDefault();
    const btn = document.getElementById('btnLog');
    const msg = document.getElementById('logMsg');
    btn.disabled = true;
    msg.innerText = '';

    const empId   = document.getElementById('logEmpId').value.trim();
    const payload = {
        employee_id:     empId,
        attendance_date: document.getElementById('logDate').value,
        time_in:         document.getElementById('logTimeIn').value,
        time_out:        document.getElementById('logTimeOut').value || null
    };

    try {
        await API.post('/api/attendance', payload);
        API.showToast('Attendance logged!', 'success');
        loadAttendance(empId);
    } catch (err) {
        msg.innerText = err.message || 'Failed to log attendance.';
    } finally {
        btn.disabled = false;
    }
}

// ─── Init based on role ───────────────────────────────────────
document.addEventListener('DOMContentLoaded', () => {
    if (user.role === 'employee') {
        initEmployeePanel();
    } else {
        initAdminPanel();
    }
});
</script>
</body>
</html>
