<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Employee | HR System</title>
    <link href="./bootstrap/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="./css/global.css">
    <script src="./bootstrap/js/bootstrap.bundle.min.js"></script>
    <script src="./js/api.js"></script>
    <script src="./js/auth.js"></script>
</head>
<body class="fade-in">

<div class="top-header">
    <a href="dashboard.html" class="brand-title"><i class="bi bi-hexagon-fill me-2"></i>EIS</a>
    <div class="d-flex align-items-center gap-3">
        <button class="btn-secondary-custom" style="padding: 0.35rem 0.75rem;" onclick="window.history.back()">Go Back</button>
    </div>
</div>

<div class="container-custom" style="max-width: 800px;">
    <h1 class="page-title text-center mb-4">Register New Employee</h1>

    <div class="clean-card">
        <form id="addEmployeeForm">
            <div class="row g-3 mb-3">
                <div class="col-md-6">
                    <label class="form-label-custom">Employee ID (Must be unique)</label>
                    <input type="text" class="form-control-custom" id="empId" placeholder="e.g. EMP1001" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label-custom">Date of Birth</label>
                    <input type="date" class="form-control-custom" id="birthday" required>
                </div>
            </div>

            <div class="row g-3 mb-3">
                <div class="col-md-4">
                    <label class="form-label-custom">First Name</label>
                    <input type="text" class="form-control-custom" id="firstName" required>
                </div>
                <div class="col-md-4">
                    <label class="form-label-custom">Middle Name</label>
                    <input type="text" class="form-control-custom" id="middleName">
                </div>
                <div class="col-md-4">
                    <label class="form-label-custom">Last Name</label>
                    <input type="text" class="form-control-custom" id="lastName" required>
                </div>
            </div>

            <div class="row g-3 mb-3">
                <div class="col-md-6">
                    <label class="form-label-custom">Department</label>
                    <input type="text" class="form-control-custom" id="department" placeholder="e.g. Engineering">
                </div>
                <div class="col-md-6">
                    <label class="form-label-custom">Position</label>
                    <input type="text" class="form-control-custom" id="position" placeholder="e.g. Software Engineer">
                </div>
            </div>

            <div class="row g-3 mb-4">
                <div class="col-md-6">
                    <label class="form-label-custom">Date Hired</label>
                    <input type="date" class="form-control-custom" id="dateHired">
                </div>
                <div class="col-md-6">
                    <label class="form-label-custom">Initial Status</label>
                    <select class="form-control-custom" id="status" required>
                        <option value="Active">Active</option>
                        <option value="Permanent">Permanent</option>
                        <option value="Temporary">Temporary</option>
                        <option value="Separated">Separated</option>
                    </select>
                </div>
            </div>

            <div class="d-flex gap-3 pt-2">
                <button type="submit" class="btn-primary-custom w-100 justify-content-center py-2" id="submitBtn">
                    Create Employee Record
                </button>
            </div>
            <div id="formMsg" class="mt-3 text-center fw-medium pb-2 text-danger"></div>
        </form>
    </div>
</div>

<script>
if (!requireRole('admin', 'hr')) {}

document.addEventListener('DOMContentLoaded', async () => {
    try {
        const data = await API.get('/api/employees/next-id');
        if (data && data.next_id) {
            const idField = document.getElementById('empId');
            idField.value = data.next_id;
            idField.setAttribute('readonly', 'true');
            idField.style.background = 'rgba(255,255,255,0.05)';
        }
    } catch (e) {
        console.error("Could not fetch next ID", e);
    }
});

document.getElementById('addEmployeeForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('submitBtn');
    const msg = document.getElementById('formMsg');
    
    btn.disabled = true;
    btn.innerText = 'Creating...';
    msg.innerText = '';
    
    const payload = {
        id: document.getElementById('empId').value.trim(),
        first_name: document.getElementById('firstName').value.trim(),
        middle_name: document.getElementById('middleName').value.trim(),
        last_name: document.getElementById('lastName').value.trim(),
        birthday: document.getElementById('birthday').value,
        position: document.getElementById('position').value.trim(),
        department: document.getElementById('department').value.trim(),
        date_hired: document.getElementById('dateHired').value,
        status: document.getElementById('status').value
    };

    try {
        await API.post('/api/employees', payload);
        msg.classList.remove('text-danger');
        msg.classList.add('text-success');
        msg.innerText = 'Record Created Successfully!';
        setTimeout(() => window.location.href = 'employee_list.html', 1000);
    } catch (err) {
        msg.innerText = err.message || 'Failed to create employee.';
        btn.disabled = false;
        btn.innerText = 'Create Employee Record';
    }
});
</script>
</body>
</html>
