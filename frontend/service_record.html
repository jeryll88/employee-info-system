<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Service Records</title>

<link href="./bootstrap/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link rel="stylesheet" href="./css/global.css">
<link rel="stylesheet" href="./css/service.css">
<script src="./js/api.js"></script>
<script src="./js/auth.js"></script>

</head>
<body>

<div class="top-header">
EMPLOYEE INFORMATION SYSTEM
</div>

<div class="container-fluid mt-4">

<div class="info-card">
    <h2 class="system-title text-center mb-4">SERVICE RECORDS</h2>

    <!-- Back + Add Buttons -->
    <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap">
        <button class="btn btn-premium btn-sm" onclick="goBack()">
            <i class="bi bi-arrow-left"></i> Back
        </button>
        <button class="btn btn-premium btn-sm add-btn" onclick="addService()">
            <i class="bi bi-plus-lg"></i> Add Record
        </button>
    </div>

<div class="table-responsive">
<table class="table-custom text-center align-middle" id="serviceTable">

<thead>
<tr>
<th>ID</th>
<th>Position / Designation</th>
<th>Status</th>
<th>Salary</th>
<th>Station</th>
<th>Duration</th>
<th>Remarks</th>
<th>Action</th>
</tr>
</thead>

<tbody></tbody>

</table>
</div>

</div>
</div>

<script src="./js/service_record.js"></script>



</body>
</html>
