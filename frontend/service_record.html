<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Service Records</title>

<link href="./bootstrap/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link rel="stylesheet" href="./css/global.css">
<link rel="stylesheet" href="./css/service.css">
<script src="./js/api.js"></script>
<script src="./js/auth.js"></script>

</head>
<body>

<div class="top-header">
EMPLOYEE INFORMATION SYSTEM
</div>

<div class="container-fluid mt-4">

<div class="premium-card">
    <h2 class="system-title text-center mb-4">SERVICE RECORDS</h2>

    <!-- Back + Add Buttons -->
    <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap">
        <button class="btn btn-premium btn-sm" onclick="goBack()">
            <i class="bi bi-arrow-left"></i> Back
        </button>
        <button class="btn btn-premium btn-sm add-btn" onclick="addService()">
            <i class="bi bi-plus-lg"></i> Add Record
        </button>
    </div>

<div class="table-responsive">
<table class="table-custom text-center align-middle" id="serviceTable">

<thead>
<tr>
<th>ID</th>
<th>Position</th>
<th>Start</th>
<th>End</th>
<th>Action</th>
</tr>
</thead>

<tbody></tbody>

</table>
</div>

</div>
</div>

<script src="./js/auth.js"></script>
<script>
const urlParams = new URLSearchParams(window.location.search);
const empId = urlParams.get('id');
const user  = getCurrentUser();

document.addEventListener('DOMContentLoaded', () => {
    if (!empId) {
        alert("No employee specified");
        window.location.href = "employee_list.html";
        return;
    }
    loadServiceRecords();
    
    if (user.role === 'employee') {
        document.querySelector('.add-btn').style.display = 'none';
    }
});

async function loadServiceRecords() {
    const tableBody = document.querySelector("#serviceTable tbody");
    try {
        const list = await API.get(`/api/service_records?employee_id=${empId}`);
        
        tableBody.innerHTML = '';
        if (list.length === 0) {
            tableBody.innerHTML = `<tr><td colspan="5">No service records yet</td></tr>`;
            return;
        }

        list.forEach(s => {
            tableBody.innerHTML += `
                <tr>
                    <td><span class="text-dim">#</span>${s.id}</td>
                    <td class="fw-bold">${s.designation}</td>
                    <td>${s.date_from || '—'}</td>
                    <td>${s.date_to || '<span class="text-success small fw-bold">PRESENT</span>'}</td>
                    <td>
                        <div class="d-flex justify-content-center gap-2">
                            ${(user.role === 'admin' || user.role === 'hr') ? `
                                <a href="edit_service.html?id=${s.id}&empId=${empId}" class="btn btn-sm btn-outline-warning" title="Edit">
                                    <i class="bi bi-pencil"></i>
                                </a>
                            ` : '—'}
                        </div>
                    </td>
                </tr>`;
        });
    } catch (err) {
        tableBody.innerHTML = `<tr><td colspan="5" class="text-danger">Error loading data</td></tr>`;
    }
}

function addService() {
    window.location.href = `add_service.html?empId=${empId}`;
}

function goBack() {
    window.location.href = `employee_info.html?id=${empId}`;
}
</script>



</body>
</html>
