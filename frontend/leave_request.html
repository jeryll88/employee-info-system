<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Leave Requests | Employee Portal</title>
<link href="./bootstrap/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link rel="stylesheet" href="./css/global.css">
<script src="./bootstrap/js/bootstrap.bundle.min.js"></script>
<script src="./js/api.js"></script>
<script src="./js/auth.js"></script>
</head>
<body class="fade-in">
<script>
    if (!requireRole('employee')) {}
</script>

<div class="content container-fluid" style="max-width:900px;">
    <!-- Header -->
    <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
        <h2 class="system-title">
            <i class="bi bi-calendar-plus-fill me-2"></i> File a Leave
        </h2>
        <button class="btn-secondary-custom btn-sm" onclick="window.location.href='dashboard.html'">
            <i class="bi bi-arrow-left me-1"></i> Back to Dashboard
        </button>
    </div>

    <!-- Application Form -->
    <div class="clean-card mb-5 border border-secondary" style="background: rgba(0,0,0,0.2);">
        <h6 class="text-white mb-4">Request Time Off</h6>
        <form id="leaveForm" onsubmit="submitLeave(event)">
            <div class="row g-3 mb-3">
                <div class="col-md-4">
                    <label class="form-label-custom">Leave Category</label>
                    <select id="leaveType" class="form-control-custom" required>
                        <option value="Sick">Sick Leave</option>
                        <option value="Vacation">Vacation Leave</option>
                    </select>
                </div>
                <div class="col-md-4">
                    <label class="form-label-custom">First Day Away</label>
                    <input type="date" id="dateFrom" class="form-control-custom" required>
                </div>
                <div class="col-md-4">
                    <label class="form-label-custom">Return Date</label>
                    <input type="date" id="dateTo" class="form-control-custom" required>
                </div>
            </div>
            <div class="mb-4">
                <label class="form-label-custom">Reason</label>
                <textarea id="leaveReason" class="form-control-custom" rows="2" placeholder="Briefly explain your reason..." required></textarea>
            </div>
            
            <button type="submit" class="btn-primary-custom w-100 py-3 rounded" id="btnSubmit" style="font-weight:700;">
                <i class="bi bi-send-fill me-2"></i> Submit Request
            </button>
            <div id="subMsg" class="mt-2 text-danger small text-center fw-medium"></div>
        </form>
    </div>

    <!-- Employee Leaf History -->
    <div class="table-responsive bg-dark rounded p-3 border border-secondary shadow-lg">
        <h6 class="text-white mb-3">My Request History</h6>
        <table class="table table-dark table-hover text-center align-middle">
            <thead>
                <tr class="text-dim small text-uppercase">
                    <th>Type</th>
                    <th>Date Timeline</th>
                    <th>Reason</th>
                    <th>Status</th>
                </tr>
            </thead>
            <tbody id="historyTableBody">
                <tr><td colspan="4" class="text-dim py-4">Loading history...</td></tr>
            </tbody>
        </table>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', loadHistory);

async function loadHistory() {
    const tbody = document.getElementById('historyTableBody');
    try {
        const leaves = await API.get('/api/leave');
        if (leaves.length === 0) {
            tbody.innerHTML = '<tr><td colspan="4" class="text-dim py-4">No active or historic requests.</td></tr>';
            return;
        }

        tbody.innerHTML = leaves.map(l => {
            const badgeClass = l.status === 'Approved' ? 'success' : l.status === 'Rejected' ? 'danger' : 'warning text-dark';
            return `
            <tr>
                <td class="fw-bold text-white">${l.leave_type}</td>
                <td class="small">${l.date_from} — ${l.date_to}</td>
                <td class="text-dim text-truncate" style="max-width:200px;" title="${l.reason}">${l.reason}</td>
                <td><span class="badge bg-${badgeClass} p-2">${l.status}</span></td>
            </tr>
            `;
        }).join('');

    } catch (e) {
        tbody.innerHTML = '<tr><td colspan="4" class="text-danger py-4">Failed to load history.</td></tr>';
    }
}

async function submitLeave(e) {
    e.preventDefault();
    const btn = document.getElementById('btnSubmit');
    const msg = document.getElementById('subMsg');
    
    btn.disabled = true;
    msg.innerText = '';
    
    const payload = {
        leave_type: document.getElementById('leaveType').value,
        date_from: document.getElementById('dateFrom').value,
        date_to: document.getElementById('dateTo').value,
        reason: document.getElementById('leaveReason').value.trim()
    };

    try {
        await API.post('/api/leave', payload);
        API.showToast("Your leave request has been submitted to HR.", "success");
        document.getElementById('leaveForm').reset();
        loadHistory();
    } catch (err) {
        msg.innerText = err.message || "Failed to submit request.";
    } finally {
        btn.disabled = false;
    }
}
</script>
</body>
</html>
