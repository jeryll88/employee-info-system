<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Leave Request | Employee Information System</title>
<link href="./bootstrap/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link rel="stylesheet" href="./css/global.css">
<script src="./bootstrap/js/bootstrap.bundle.min.js"></script>
<script src="./js/api.js"></script>
<script src="./js/auth.js"></script>
</head>
<body>

<!-- AUTH GUARD: Employee only -->
<script>if (!requireRole('employee')) {}</script>

<div class="content container-fluid">

    <!-- Header -->
    <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
        <div class="page-title">
            <i class="bi bi-calendar-plus"></i> Leave Request
        </div>
        <div class="d-flex align-items-center gap-3">
            <div id="userInfo" style="font-size:14px;color:white;"></div>
            <button class="btn-logout" onclick="authLogout()">
                <i class="bi bi-box-arrow-right me-1"></i>Logout
            </button>
        </div>
    </div>

    <!-- Nav -->
    <div class="row g-3 mb-4" id="navBar"></div>

    <div class="row g-4">

        <!-- LEFT: Balance + Form -->
        <div class="col-lg-5">

            <!-- Leave Balance -->
            <div class="premium-card mb-4 bg-opacity-10" style="background: rgba(100, 255, 218, 0.03);">
                <h5 class="text-dim small text-uppercase mb-4"><i class="bi bi-wallet2 me-2"></i> My Leave Balance</h5>
                <div class="row g-3">
                    <div class="col-6">
                        <div class="premium-card text-center p-3 border-success border-opacity-25" style="background: rgba(34, 197, 94, 0.05);">
                            <i class="bi bi-heart-pulse fs-3 text-success mb-2 d-block"></i>
                            <div class="h3 fw-bold text-success mb-0" id="sickBalance">0</div>
                            <div class="text-dim smaller text-uppercase">Sick Leave</div>
                        </div>
                    </div>
                    <div class="col-6">
                        <div class="premium-card text-center p-3 border-primary border-opacity-25" style="background: rgba(100, 255, 218, 0.05);">
                            <i class="bi bi-umbrella fs-3 text-primary mb-2 d-block"></i>
                            <div class="h3 fw-bold text-primary mb-0" id="vacationBalance">0</div>
                            <div class="text-dim smaller text-uppercase">Vacation</div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Leave Request Form -->
            <div class="premium-card">
                <h5 class="text-dim small text-uppercase mb-4"><i class="bi bi-pencil-square me-2"></i> File a Request</h5>
                <form id="leaveForm" onsubmit="event.preventDefault(); submitLeave();">
                    <div class="mb-3">
                        <label class="form-label text-dim small">Leave Type</label>
                        <select class="form-select bg-dark text-white border-secondary" id="leaveType" required>
                            <option value="">-- Select Type --</option>
                            <option>Sick Leave</option>
                            <option>Vacation Leave</option>
                        </select>
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label text-dim small">Start Date</label>
                            <input type="date" class="form-control bg-dark text-white border-secondary" id="startDate" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label text-dim small">End Date</label>
                            <input type="date" class="form-control bg-dark text-white border-secondary" id="endDate" required>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label text-dim small">Duration</label>
                        <input type="text" class="form-control bg-dark-dim text-dim border-secondary" id="numDays" readonly style="background: rgba(255,255,255,0.03);">
                    </div>
                    <div class="mb-4">
                        <label class="form-label text-dim small">Reason / Notes</label>
                        <textarea class="form-control bg-dark text-white border-secondary" id="reason" rows="3" placeholder="State your reason..."></textarea>
                    </div>
                    <div class="d-grid">
                        <button type="submit" class="btn btn-premium btn-lg" id="submitBtn">
                            <i class="bi bi-send me-2"></i> Submit Request
                        </button>
                    </div>
                </form>
            </div>
        </div>

        <!-- RIGHT: My Leave History -->
        <div class="col-lg-7">
            <div class="premium-card">
                <h5 class="text-dim small text-uppercase mb-4"><i class="bi bi-clock-history me-2"></i> My History</h5>
                <div class="table-responsive">
                    <table class="table table-dark table-hover mb-0" style="--bs-table-bg: transparent;">
                        <thead>
                            <tr class="text-dim small text-uppercase">
                                <th>Type</th>
                                <th>Period</th>
                                <th>Days</th>
                                <th>Status</th>
                                <th>Remarks</th>
                            </tr>
                        </thead>
                        <tbody id="leaveHistoryBody" class="align-middle">
                            <tr><td colspan="5" class="text-center py-5"><div class="spinner-border text-primary"></div></td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>


<script>
const user = getCurrentUser();

document.addEventListener('DOMContentLoaded', () => {
    document.getElementById('navBar').innerHTML  = buildNav(user.role, 'leave_request.html');
    document.getElementById('userInfo').innerHTML =
        `<span style="color:#9ca3af">Logged in as <strong style="color:white">${user.username}</strong></span>
         &nbsp;${getRoleBadgeHtml(user.role)}`;

    loadBalance();
    loadLeaveHistory();
    calcDays();

    // Set min date to today
    const today = new Date().toISOString().split('T')[0];
    document.getElementById('startDate').min = today;
    document.getElementById('endDate').min   = today;
});

document.getElementById('startDate').addEventListener('change', calcDays);
document.getElementById('endDate').addEventListener('change', calcDays);

function calcDays() {
    const s = document.getElementById('startDate').value;
    const e = document.getElementById('endDate').value;
    if (s && e) {
        const ms   = new Date(e) - new Date(s);
        const days = Math.max(Math.round(ms/(1000*60*60*24)) + 1, 1);
        document.getElementById('numDays').value = `${days} day${days !== 1 ? 's' : ''}`;
    } else {
        document.getElementById('numDays').value = '';
    }
}

async function loadBalance() {
    try {
        const data = await API.get('/api/leave/balance');
        document.getElementById('sickBalance').textContent    = data.sick_leave ?? '0';
        document.getElementById('vacationBalance').textContent= data.vacation_leave ?? '0';
    } catch(e) {}
}

async function loadLeaveHistory() {
    const tbody = document.getElementById('leaveHistoryBody');
    try {
        const items = await API.get('/api/leave');
        tbody.innerHTML = '';
        if (items.length === 0) {
            tbody.innerHTML = '<tr><td colspan="5" class="text-center text-dim py-5">No leave history found.</td></tr>';
            return;
        }
        items.forEach(l => {
            const statusBadge = {
                Pending:  '<span class="badge rounded-pill bg-warning bg-opacity-10 text-warning px-3">Pending</span>',
                Approved: '<span class="badge rounded-pill bg-success bg-opacity-10 text-success px-3">Approved</span>',
                Rejected: '<span class="badge rounded-pill bg-danger bg-opacity-10 text-danger px-3">Rejected</span>'
            }[l.status] || l.status;

            tbody.innerHTML += `
                <tr>
                    <td><span class="small fw-bold">${l.leave_type}</span></td>
                    <td>
                        <div class="small">${l.start_date}</div>
                        <div class="text-dim smaller">to ${l.end_date}</div>
                    </td>
                    <td><span class="fw-bold">${l.num_days}</span></td>
                    <td>${statusBadge}</td>
                    <td class="text-dim small">${l.remarks || '—'}</td>
                </tr>`;
        });
    } catch(e) {
        tbody.innerHTML = `<tr><td colspan="5" class="text-center text-danger py-4">Error loading history.</td></tr>`;
    }
}

async function submitLeave() {
    const leaveType = document.getElementById('leaveType').value;
    const startDate = document.getElementById('startDate').value;
    const endDate   = document.getElementById('endDate').value;
    const reason    = document.getElementById('reason').value;
    const btn       = document.getElementById('submitBtn');

    if (new Date(endDate) < new Date(startDate)) {
        API.showToast("End date must be after start date.", "warning");
        return;
    }

    btn.disabled = true;
    btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Submitting...';

    try {
        await API.post('/api/leave', { leave_type: leaveType, start_date: startDate, end_date: endDate, reason });
        API.showToast("Leave request submitted successfully!");
        API.logActivity(`Submitted leave request: ${leaveType} (${startDate} to ${endDate})`);
        
        document.getElementById('leaveForm').reset();
        document.getElementById('numDays').value = '';
        await loadBalance();
        await loadLeaveHistory();
    } catch(e) {}
    finally {
        btn.disabled = false;
        btn.innerHTML = '<i class="bi bi-send me-2"></i> Submit Request';
    }
}

function showAlert(msg, type) {
    const box = document.getElementById('alertBox');
    box.innerHTML = `<div class="alert-eis ${type}">${msg}</div>`;
    setTimeout(() => box.innerHTML = '', 4000);
}
</script>
</body>
</html>
