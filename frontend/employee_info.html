<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Employee Information</title>
<link href="./bootstrap/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link rel="stylesheet" href="./css/global.css">
<link rel="stylesheet" href="./css/info.css">
<script src="./bootstrap/js/bootstrap.bundle.min.js"></script>
<script src="./js/api.js"></script>
<script src="./js/auth.js"></script>
<script src="./js/employee_info.js"></script>
</head>
<body>

    <!-- Top Header -->
    <div class="top-header">
        EMPLOYEE INFORMATION SYSTEM
    </div>

    <div class="container-fluid">
        <div class="row justify-content-center">
            <div class="col-md-9 col-lg-10 content-area">
                <div class="premium-card text-center">
                    <!-- Back Button and Edit -->
                    <div class="text-start mb-3 d-flex justify-content-between">
                        <button class="btn-premium" onclick="goBack()">
                            <i class="bi bi-arrow-left"></i> Back
                        </button>
                        <button class="btn-premium" id="editProfileBtn" onclick="editProfile()" style="display:none;">
                            <i class="bi bi-pencil-fill"></i> Edit Details
                        </button>
                    </div>

                    <!-- Card Title -->
                    <h2 class="system-title">
                        EMPLOYEE INFORMATION SYSTEM
                    </h2>

                    <!-- Employee Details -->
                    <div class="employee-number mb-4">
                        Employee No: <strong id="empNumber"></strong>
                    </div>

                    <hr class="divider">

                    <div class="row text-start mt-4">
                        <div class="col-md-6 mb-3">
                            <label class="label-title">Last Name</label>
                            <div class="info-value" id="lastName"></div>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="label-title">First Name</label>
                            <div class="info-value" id="firstName"></div>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="label-title">Birthday</label>
                            <div class="info-value" id="birthday"></div>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="label-title">Status</label>
                            <div class="info-value" id="status"></div>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="label-title">Position</label>
                            <div class="info-value" id="position"></div>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="label-title">Department</label>
                            <div class="info-value" id="department"></div>
                        </div>
                    </div>

                    <!-- Action Buttons (replaced the broken absolute sidebar) -->
                    <div class="action-buttons">
                        <button class="action-btn" onclick="goToTrainings()">
                            <i class="bi bi-mortarboard-fill"></i> Trainings
                        </button>
                        <button class="action-btn" onclick="goToServiceRecords()">
                            <i class="bi bi-briefcase-fill"></i> Service Records
                        </button>
                        <button class="action-btn" onclick="goToPerformance()">
                            <i class="bi bi-star-fill"></i> Performance
                        </button>
                    </div>

                </div>
            </div>
        </div>
    </div>

</body>
</html>
