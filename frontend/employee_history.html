<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee History | Employee Information System</title>
    <link href="./bootstrap/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="./css/global.css">
    <link rel="stylesheet" href="./css/history.css">
    <script src="./bootstrap/js/bootstrap.bundle.min.js"></script>
    <script src="./js/api.js"></script>
    <script src="./js/auth.js"></script>
</head>
<body class="fade-in">

    <div class="top-header" id="pageTitle">
        EMPLOYEE HISTORY
    </div>

    <div class="container-fluid mt-4">
        <div class="row justify-content-center">
            <div class="col-md-11 col-lg-10">
                
                <!-- Back Header -->
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <button class="btn-premium" onclick="history.back()">
                        <i class="bi bi-arrow-left me-1"></i> Back
                    </button>
                    <div id="employeeHeader" class="text-end">
                        <h4 class="text-white mb-0" id="histEmpName">...</h4>
                        <div class="text-dim small" id="histEmpId">...</div>
                    </div>
                </div>

                <!-- History Tabs -->
                <ul class="nav nav-tabs premium-tabs mb-4" id="historyTabs" role="tablist">
                    <li class="nav-item" role="presentation">
                        <button class="nav-link active" id="payroll-tab" data-bs-toggle="tab" data-bs-target="#payrollSection" type="button" role="tab">
                            <i class="bi bi-wallet2 me-2"></i> Payroll History
                        </button>
                    </li>
                    <li class="nav-item" role="presentation">
                        <button class="nav-link" id="leave-tab" data-bs-toggle="tab" data-bs-target="#leaveSection" type="button" role="tab">
                            <i class="bi bi-calendar-event me-2"></i> Leave History
                        </button>
                    </li>
                </ul>

                <div class="tab-content" id="historyTabContent">
                    <!-- Payroll History Section -->
                    <div class="tab-pane fade show active" id="payrollSection" role="tabpanel">
                        <div class="clean-card bg-dark-glass">
                            <h5 class="section-title mb-4"><i class="bi bi-receipt me-2"></i>Recent Payslips</h5>
                            <div id="payrollList" class="history-list">
                                <div class="text-dim text-center py-5">Loading payroll history...</div>
                            </div>
                        </div>
                    </div>

                    <!-- Leave History Section -->
                    <div class="tab-pane fade" id="leaveSection" role="tabpanel">
                        <div class="clean-card bg-dark-glass">
                            <h5 class="section-title mb-4"><i class="bi bi-calendar-check me-2"></i>Leave Requests</h5>
                            <div id="leaveList" class="history-list">
                                <div class="text-dim text-center py-5">Loading leave history...</div>
                            </div>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <!-- Modal for Detailed Payslip View -->
    <div class="modal fade" id="payslipModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-lg">
            <div class="modal-content bg-dark border-secondary">
                <div class="modal-header border-secondary">
                    <h5 class="modal-title text-white">Payslip Details</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body p-4" id="payslipModalBody">
                    <!-- Payslip content injected here -->
                </div>
                <div class="modal-footer border-secondary">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                    <button type="button" class="btn btn-primary" onclick="window.print()">Print</button>
                </div>
            </div>
        </div>
    </div>

    <script src="./js/employee_history.js"></script>
</body>
</html>
