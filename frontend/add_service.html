<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Add Service Record</title>

    <link href="./bootstrap/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="./css/global.css">
    <link rel="stylesheet" href="./css/add_service.css">
    <script src="./bootstrap/js/bootstrap.bundle.min.js"></script>
    <script src="./js/api.js"></script>
    <script src="./js/auth.js"></script>

</head>

<body>

    <div class="container d-flex justify-content-center align-items-center" style="min-height:100vh;">

        <div class="premium-card" style="width:100%; max-width:600px;">
            <h3 class="system-title text-center mb-4">Add Service Record</h3>

            <form id="serviceForm">
                <div class="mb-3">
                    <label class="form-label text-dim small">Employee ID</label>
                    <input type="text" id="displayEmpId" class="form-control" readonly
                        style="background: rgba(255,255,255,0.05);">
                </div>
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label text-dim small">Designation</label>
                        <input type="text" id="designation" class="form-control" required>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label text-dim small">Status (e.g. Regular)</label>
                        <input type="text" id="status" class="form-control">
                    </div>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label text-dim small">Salary Range</label>
                        <input type="text" id="salaryRange" class="form-control">
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label text-dim small">Station</label>
                        <input type="text" id="station" class="form-control">
                    </div>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label text-dim small">Date From</label>
                        <input type="date" id="dateFrom" class="form-control" required>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label text-dim small">Date To</label>
                        <input type="date" id="dateTo" class="form-control">
                        <small class="text-dim smaller">Leave blank if Present</small>
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label text-dim small">Remarks</label>
                    <textarea id="remarks" class="form-control" rows="2"></textarea>
                </div>

                <div class="d-grid gap-2 mt-4">
                    <button type="submit" class="btn btn-premium">
                        <i class="bi bi-save me-2"></i> Save Record
                    </button>
                    <button type="button" class="btn btn-outline-secondary" onclick="goBack()">
                        <i class="bi bi-x-lg me-2"></i> Cancel
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script src="./js/auth.js"></script>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const empId = urlParams.get('empId');
        document.getElementById('displayEmpId').value = empId;

        document.getElementById('serviceForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const payload = {
                employee_id: empId,
                designation: document.getElementById('designation').value.trim(),
                status: document.getElementById('status').value.trim(),
                salary_range: document.getElementById('salaryRange').value.trim(),
                station: document.getElementById('station').value.trim(),
                date_from: document.getElementById('dateFrom').value,
                date_to: document.getElementById('dateTo').value || null,
                remarks: document.getElementById('remarks').value.trim()
            };

            const btn = e.target.querySelector('button[type="submit"]');
            btn.disabled = true;
            btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Saving...';

            try {
                await API.post('/api/service_records', payload);
                API.showToast("Service record saved successfully!");
                API.logActivity(`Added service record for Employee ${empId}: ${payload.designation}`);
                setTimeout(goBack, 1000);
            } catch (err) {
                btn.disabled = false;
                btn.innerHTML = '<i class="bi bi-save me-2"></i> Save Record';
            }
        });

        function goBack() {
            window.location.href = `service_record.html?id=${empId}`;
        }
    </script>
</body>

</html>
