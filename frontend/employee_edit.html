<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Employee | HR System</title>
    <link href="./bootstrap/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="./css/global.css">
    <script src="./bootstrap/js/bootstrap.bundle.min.js"></script>
    <script src="./js/api.js"></script>
    <script src="./js/auth.js"></script>
</head>
<body class="fade-in">

<div class="top-header">
    <a href="dashboard.html" class="brand-title"><i class="bi bi-hexagon-fill me-2"></i>EIS</a>
    <div class="d-flex align-items-center gap-3">
        <button class="btn-secondary-custom" style="padding: 0.35rem 0.75rem;" onclick="window.history.back()">
            <i class="bi bi-arrow-left me-1"></i> Go Back
        </button>
    </div>
</div>

<div class="container-custom" style="max-width: 800px;">
    <h1 class="page-title text-center mb-4">Edit Employee Record</h1>

    <div class="clean-card">
        <form id="editEmployeeForm">
            <div class="row g-3 mb-3">
                <div class="col-md-6">
                    <label class="form-label-custom">Employee ID (Locked)</label>
                    <input type="text" class="form-control-custom bg-light" id="empId" disabled>
                </div>
                <div class="col-md-6">
                    <label class="form-label-custom">Date of Birth</label>
                    <input type="date" class="form-control-custom" id="birthday">
                </div>
            </div>

            <div class="row g-3 mb-3">
                <div class="col-md-4">
                    <label class="form-label-custom">First Name</label>
                    <input type="text" class="form-control-custom" id="firstName" required>
                </div>
                <div class="col-md-4">
                    <label class="form-label-custom">Middle Name</label>
                    <input type="text" class="form-control-custom" id="middleName">
                </div>
                <div class="col-md-4">
                    <label class="form-label-custom">Last Name</label>
                    <input type="text" class="form-control-custom" id="lastName" required>
                </div>
            </div>

            <div class="row g-3 mb-3">
                <div class="col-md-6">
                    <label class="form-label-custom">Department</label>
                    <input type="text" class="form-control-custom" id="department" placeholder="e.g. Engineering">
                </div>
                <div class="col-md-6">
                    <label class="form-label-custom">Position</label>
                    <input type="text" class="form-control-custom" id="position" placeholder="e.g. Software Engineer">
                </div>
            </div>

            <div class="row g-3 mb-4">
                <div class="col-md-6">
                    <label class="form-label-custom">Date Hired</label>
                    <input type="date" class="form-control-custom" id="dateHired">
                </div>
                <div class="col-md-6">
                    <label class="form-label-custom">Status</label>
                    <select class="form-control-custom" id="status" required>
                        <option value="Active">Active</option>
                        <option value="Permanent">Permanent</option>
                        <option value="Temporary">Temporary</option>
                        <option value="Separated">Separated</option>
                    </select>
                </div>
            </div>

            <div class="d-flex gap-3 pt-2">
                <button type="submit" class="btn-primary-custom w-100 justify-content-center py-2" id="submitBtn">
                    <i class="bi bi-save me-2"></i> Update Record
                </button>
            </div>
            <div id="formMsg" class="mt-3 text-center fw-medium pb-2 text-danger"></div>
        </form>
    </div>
</div>

<script>
const active_user = getCurrentUser();
const urlParams = new URLSearchParams(window.location.search);
const targetId = urlParams.get('id');

if (!active_user) window.location.replace('login.html');
else if (active_user.role !== 'admin' && active_user.role !== 'hr') {
    if (active_user.role !== 'employee' || active_user.employee_id !== targetId) {
        window.location.replace('dashboard.html');
    }
}

document.addEventListener('DOMContentLoaded', async () => {
    if (!targetId) return window.history.back();
    try {
        const emp = await API.get(`/api/employees/${targetId}`);
        document.getElementById('empId').value = emp.id || emp.employee_id || '';
        document.getElementById('firstName').value = emp.first_name || '';
        document.getElementById('middleName').value = emp.middle_name || '';
        document.getElementById('lastName').value = emp.last_name || '';

        // Dates are now returned as YYYY-MM-DD strings — set directly
        document.getElementById('birthday').value = (emp.birthday || '').substring(0, 10);
        document.getElementById('position').value = emp.position || '';
        document.getElementById('department').value = emp.department || '';
        document.getElementById('dateHired').value = (emp.date_hired || '').substring(0, 10);

        const statusSel = document.getElementById('status');
        if (emp.status) {
            statusSel.value = emp.status;
            // If value not in options, add it dynamically
            if (statusSel.value !== emp.status) {
                const opt = document.createElement('option');
                opt.value = emp.status;
                opt.textContent = emp.status;
                statusSel.appendChild(opt);
                statusSel.value = emp.status;
            }
        }
    } catch (e) {
        document.getElementById('formMsg').innerText = 'Failed to load employee data.';
    }
});

document.getElementById('editEmployeeForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('submitBtn');
    const msg = document.getElementById('formMsg');

    btn.disabled = true;
    btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Saving...';
    msg.innerText = '';

    const payload = {
        first_name: document.getElementById('firstName').value.trim(),
        middle_name: document.getElementById('middleName').value.trim(),
        last_name: document.getElementById('lastName').value.trim(),
        birthday: document.getElementById('birthday').value || null,
        position: document.getElementById('position').value.trim(),
        department: document.getElementById('department').value.trim(),
        date_hired: document.getElementById('dateHired').value || null,
        status: document.getElementById('status').value
    };

    try {
        await API.put(`/api/employees/${targetId}`, payload);
        msg.classList.remove('text-danger');
        msg.classList.add('text-success');
        msg.innerText = 'Record Updated Successfully!';
        API.logActivity(`Updated employee: ${payload.first_name} ${payload.last_name}`);
        setTimeout(() => window.location.href = 'employee_list.html', 1000);
    } catch (err) {
        msg.classList.add('text-danger');
        msg.innerText = err.message || 'Failed to update employee.';
        btn.disabled = false;
        btn.innerHTML = '<i class="bi bi-save me-2"></i> Update Record';
    }
});
</script>
</body>
</html>
