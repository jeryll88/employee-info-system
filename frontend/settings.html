<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>System Settings | Admin Portal</title>
<link href="./bootstrap/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link rel="stylesheet" href="./css/global.css">
<script src="./bootstrap/js/bootstrap.bundle.min.js"></script>
<script src="./js/api.js"></script>
<script src="./js/auth.js"></script>
</head>
<body class="fade-in">
<script>
    // ONLY Admins get access to global system settings and security modules.
    if (!requireRole('admin')) {}
</script>

<div class="content container-fluid" style="max-width:1000px;">
    <!-- Header -->
    <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
        <h2 class="system-title">
            <i class="bi bi-gear-fill me-2"></i> System Configuration
        </h2>
        <button class="btn-secondary-custom btn-sm" onclick="window.location.href='dashboard.html'">
            <i class="bi bi-arrow-left me-1"></i> Back to Dashboard
        </button>
    </div>

    <!-- Security & Settings Cards -->
    <div class="row g-4">
        <!-- System Security Configuration -->
        <div class="col-md-6">
            <div class="clean-card h-100 border border-secondary" style="background: rgba(0,0,0,0.2);">
                <h5 class="text-white mb-4"><i class="bi bi-shield-lock me-2 text-warning"></i>Security Measures</h5>
                
                <div class="form-check form-switch mb-3">
                    <input class="form-check-input" type="checkbox" id="twoFactorAuth" checked disabled>
                    <label class="form-check-label text-dim" for="twoFactorAuth">Enforce Login IP Tracking</label>
                </div>
                <div class="form-check form-switch mb-3">
                    <input class="form-check-input" type="checkbox" id="pwExpiration" checked disabled>
                    <label class="form-check-label text-dim" for="pwExpiration">90-Day Password Expiration</label>
                </div>

                <div class="mt-4">
                    <label class="form-label-custom d-block">Session Timeout Limit</label>
                    <select class="form-control-custom w-100" disabled>
                        <option>30 Minutes (Strict)</option>
                        <option selected>60 Minutes (Standard)</option>
                    </select>
                </div>
            </div>
        </div>

        <!-- System Maintenance -->
        <div class="col-md-6">
            <div class="clean-card h-100 border border-secondary" style="background: rgba(0,0,0,0.2);">
                <h5 class="text-white mb-4"><i class="bi bi-server me-2 text-primary"></i>Database Maintenance</h5>
                
                <div class="mb-4">
                    <div class="text-dim mb-2 small fw-bold">LAST SYSTEM BACKUP</div>
                    <div class="text-white">Autosaved today at 04:00 AM</div>
                </div>
                
                <button class="btn-outline-light btn-sm w-100 mb-3" onclick="triggerBackup()">
                    <i class="bi bi-cloud-arrow-down-fill me-2"></i> Generate Manual Backup
                </button>
                <button class="btn-danger btn-sm w-100" onclick="alert('This will put the server offline for maintenance.')">
                    <i class="bi bi-x-octagon-fill me-2"></i> Enter Maintenance Mode
                </button>
            </div>
        </div>
    </div>
</div>

<script>
function triggerBackup() {
    API.showToast("Database safely backed up to secure volumes.", "success");
}
</script>
</body>
</html>
