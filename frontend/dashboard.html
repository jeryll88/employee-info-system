<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard | Employee Information System</title>
<link href="./bootstrap/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link rel="stylesheet" href="./css/global.css">
<link rel="stylesheet" href="./css/dashboard.css">
<script src="./bootstrap/js/bootstrap.bundle.min.js"></script>
<script src="./js/api.js"></script>
<script src="./js/auth.js"></script>
<script src="./js/activity_logger.js"></script>
</head>
<body>

<!-- AUTH GUARD -->
<script>
    if (!requireAuth()) { /* redirects */ }
</script>

<div class="content container-fluid">

    <!-- Header -->
    <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
        <h2 class="system-title">
            <i class="bi bi-building"></i> Employee Information System
        </h2>
        <div class="d-flex align-items-center gap-3">
            <div id="userInfo" class="text-white" style="font-size:14px;"></div>
            <button class="btn-logout" onclick="authLogout()">
                <i class="bi bi-box-arrow-right me-1"></i>Logout
            </button>
        </div>
    </div>

    <!-- Navigation (role-aware) -->
    <div class="row g-3 mb-4" id="navBar"></div>

    <!-- Statistics -->
    <div class="row g-4 mb-5">
        <div class="col-md-3">
            <div class="glass-card stat-box stat-active">
                <i class="bi bi-person-check fs-3"></i>
                <div class="mt-2">ACTIVE EMPLOYEES</div>
                <div class="stat-number" id="activeCount">0</div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="glass-card stat-box stat-permanent">
                <i class="bi bi-person-badge fs-3"></i>
                <div class="mt-2">PERMANENT</div>
                <div class="stat-number" id="permanentCount">0</div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="glass-card stat-box stat-temporary">
                <i class="bi bi-person fs-3"></i>
                <div class="mt-2">TEMPORARY</div>
                <div class="stat-number" id="temporaryCount">0</div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="glass-card stat-box stat-separated">
                <i class="bi bi-person-dash fs-3"></i>
                <div class="mt-2">SEPARATED</div>
                <div class="stat-number" id="separatedCount">0</div>
            </div>
        </div>
    </div>

    <!-- Leave Balance (shown only for employee role) -->
    <div class="row g-4 mb-5" id="leaveBalanceSection" style="display:none!important">
        <div class="col-12">
            <div class="glass-card">
                <h5 class="mb-3"><i class="bi bi-calendar-check"></i> My Leave Balance</h5>
                <div class="row g-3">
                    <div class="col-md-3">
                        <div class="glass-card text-center" style="background:rgba(34,197,94,0.1)">
                            <i class="bi bi-heart-pulse fs-3 text-success"></i>
                            <div class="mt-2" style="font-size:13px;">SICK LEAVE</div>
                            <div class="stat-number text-success" id="sickBalance">–</div>
                            <div style="font-size:11px;color:#9ca3af;">days remaining</div>
                        </div>
                    </div>
                    <div class="col-md-3">
                        <div class="glass-card text-center" style="background:rgba(59,130,246,0.1)">
                            <i class="bi bi-umbrella fs-3 text-primary"></i>
                            <div class="mt-2" style="font-size:13px;">VACATION LEAVE</div>
                            <div class="stat-number text-primary" id="vacationBalance">–</div>
                            <div style="font-size:11px;color:#9ca3af;">days remaining</div>
                        </div>
                    </div>
                    <div class="col-md-6 d-flex align-items-center">
                        <a href="leave_request.html" class="btn btn-primary w-100" style="border-radius:12px;padding:15px;font-weight:600;letter-spacing:1px;">
                            <i class="bi bi-plus-circle me-2"></i>FILE A LEAVE REQUEST
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>    <!-- Recent Activities -->
    <div class="glass-card">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h5 class="mb-0"><i class="bi bi-clock-history me-2"></i>Recent Activities</h5>
            <button class="btn btn-outline-danger btn-sm border-0" onclick="clearActivities()">
                <i class="bi bi-trash"></i>
            </button>
        </div>
        <div class="table-responsive">
            <table class="table table-dark table-hover align-middle mb-0">
                <thead>
                    <tr class="text-dim small text-uppercase">
                        <th style="width: 50px">#</th>
                        <th>Activity</th>
                        <th>User</th>
                        <th>Timestamp</th>
                    </tr>
                </thead>
                <tbody id="recentActivities">
                    <tr><td colspan="4" class="text-center py-4">Loading activities...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

</div>


<script src="./js/dashboard.js"></script>
</body>
</html>
