<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Directory | HR System</title>
    <link href="./bootstrap/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="./css/global.css">
    <script src="./bootstrap/js/bootstrap.bundle.min.js"></script>
    <script src="./js/api.js"></script>
    <script src="./js/auth.js"></script>
</head>
<body class="fade-in">
<script>if (!requireAuth()) {}</script>

<div class="top-header">
    <a href="dashboard.html" class="brand-title"><i class="bi bi-hexagon-fill me-2"></i>EIS</a>
    <div class="d-flex align-items-center gap-3">
        <span class="fw-medium text-dim" id="userNameDisplay"></span>
        <button class="btn-secondary-custom" style="padding: 0.35rem 0.75rem;" onclick="authLogout()">Logout</button>
    </div>
</div>

<div class="container-custom">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="page-title mb-0">Employee Directory</h1>
        <div id="adminActions"></div>
    </div>

    <!-- Smart Search and Filter Layout -->
    <div class="clean-card mb-4" id="searchFilters" style="display:none;">
        <h6 class="mb-3" style="font-weight:700; color:var(--text-main);"><i class="bi bi-search me-2"></i>Smart Search</h6>
        <div class="row g-3">
            <div class="col-md-4">
                <input type="text" id="filterQ" class="form-control-custom" placeholder="Search by name or ID...">
            </div>
            <div class="col-md-3">
                <input type="text" id="filterDept" class="form-control-custom" placeholder="Department...">
            </div>
            <div class="col-md-3">
                <select id="filterStatus" class="form-control-custom" onchange="loadDirectory()">
                    <option value="">All Statuses</option>
                    <option value="Active">Active</option>
                    <option value="Permanent">Permanent</option>
                    <option value="Temporary">Temporary</option>
                    <option value="Separated">Separated</option>
                </select>
            </div>
            <div class="col-md-2 d-flex">
                <button class="btn-primary-custom w-100 justify-content-center" onclick="loadDirectory()">Find</button>
            </div>
        </div>
    </div>

    <div class="table-wrapper">
        <table class="table-custom">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Department</th>
                    <th>Position</th>
                    <th>Status</th>
                    <th class="text-end">Actions</th>
                </tr>
            </thead>
            <tbody id="employeeListBody">
                <tr><td colspan="6" class="text-center py-4 text-dim">Loading employees...</td></tr>
            </tbody>
        </table>
    </div>
</div>

<script src="./js/employee_list.js"></script>
</body>
</html>
